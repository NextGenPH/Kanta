plugins {
    alias(libs.plugins.android.application)
}

// Load local.properties for sensitive keys
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

android {
    namespace 'com.sns.kanta'
    compileSdk 37

    defaultConfig {
        applicationId "com.sns.kanta"
        minSdk 24
        targetSdk 37
        versionCode 12
        versionName "1.1.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // Use key from local.properties, or fallback to gradle.properties/environment
        def supabaseKey = localProperties.getProperty("SUPABASE_ANON_KEY") ?: project.findProperty("SUPABASE_ANON_KEY") ?: ""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${supabaseKey}\""

        def supabaseUrl = localProperties.getProperty("SUPABASE_URL") ?: project.findProperty("SUPABASE_URL") ?: "https://azjtejdxfqjwyxquszzm.supabase.co/"
        buildConfigField "String", "SUPABASE_URL", "\"${supabaseUrl}\""
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    signingConfigs {
        release {
            // Pull credentials from local.properties for security
            storeFile file(localProperties.getProperty("RELEASE_STORE_FILE") ?: "release-key.jks")
            storePassword localProperties.getProperty("RELEASE_STORE_PASSWORD") ?: "password"
            keyAlias localProperties.getProperty("RELEASE_KEY_ALIAS") ?: "key-alias"
            keyPassword localProperties.getProperty("RELEASE_KEY_PASSWORD") ?: "password"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            signingConfig signingConfigs.release
        }

        debug {
            minifyEnabled false
            shrinkResources false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    implementation libs.nextgenupdater
    implementation libs.swiperefreshlayout
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.lifecycle.livedata.ktx
    implementation libs.palette
    implementation libs.core
    implementation libs.retrofit
    implementation libs.converter.gson
    implementation libs.logging.interceptor
    implementation libs.glide
    implementation libs.glide.transformations
    implementation libs.shimmer
    implementation libs.room.runtime
    implementation libs.security.crypto
    annotationProcessor libs.room.compiler
    annotationProcessor libs.compiler
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}